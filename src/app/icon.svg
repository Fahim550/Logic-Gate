<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="chipBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0284c7" />
      <stop offset="100%" stopColor="#0369a1" />
    </linearGradient>
    <linearGradient id="chipDie" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0b1329" />
      <stop offset="100%" stopColor="#030712" />
    </linearGradient>
    <filter id="chipGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#00f0ff" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Base App Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#chipBg)" />
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- Integrated Circuit (IC) Pins -->
  <!-- Top Pins -->
  <line x1="24" y1="7" x2="24" y2="16" stroke="#e0f2fe" stroke-width="2.5" stroke-linecap="round" />
  <line x1="32" y1="7" x2="32" y2="16" stroke="#e0f2fe" stroke-width="2.5" stroke-linecap="round" />
  <line x1="40" y1="7" x2="40" y2="16" stroke="#e0f2fe" stroke-width="2.5" stroke-linecap="round" />

  <!-- Bottom Pins -->
  <line x1="24" y1="48" x2="24" y2="57" stroke="#e0f2fe" stroke-width="2.5" stroke-linecap="round" />
  <line x1="32" y1="48" x2="32" y2="57" stroke="#e0f2fe" stroke-width="2.5" stroke-linecap="round" />
  <line x1="40" y1="48" x2="40" y2="57" stroke="#e0f2fe" stroke-width="2.5" stroke-linecap="round" />

  <!-- Left Pins -->
  <line x1="7" y1="24" x2="16" y2="24" stroke="#e0f2fe" stroke-width="2.5" stroke-linecap="round" />
  <line x1="7" y1="32" x2="16" y2="32" stroke="#e0f2fe" stroke-width="2.5" stroke-linecap="round" />
  <line x1="7" y1="40" x2="16" y2="40" stroke="#e0f2fe" stroke-width="2.5" stroke-linecap="round" />

  <!-- Right Pins -->
  <line x1="48" y1="24" x2="57" y2="24" stroke="#e0f2fe" stroke-width="2.5" stroke-linecap="round" />
  <line x1="48" y1="32" x2="57" y2="32" stroke="#e0f2fe" stroke-width="2.5" stroke-linecap="round" />
  <line x1="48" y1="40" x2="57" y2="40" stroke="#e0f2fe" stroke-width="2.5" stroke-linecap="round" />

  <!-- Central Microchip Silicon Die -->
  <rect x="16" y="16" width="32" height="32" rx="7" fill="url(#chipDie)" stroke="#7dd3fc" stroke-width="2" />

  <!-- Logic Core / Glowing Micro-Junction -->
  <circle cx="32" cy="32" r="6" fill="#00f0ff" filter="url(#chipGlow)" />
  <circle cx="32" cy="32" r="2.5" fill="#ffffff" />
</svg>
